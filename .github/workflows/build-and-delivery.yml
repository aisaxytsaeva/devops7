name: Build and Delivery

on:
  workflow_run:
    workflows: ["Test Python App"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  cd:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      BUILD_CONTEXT: ${{ github.workspace }}/docker-build
    
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          path: docker-build
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}  # Ваш SSH-ключ

      # 2. Создаем Dockerfile в явно указанной папке
      - name: Prepare Dockerfile
        working-directory: ${{ github.workspace }}/docker-build
        run: |
          cat <<EOF > Dockerfile
          FROM python:3.12-slim
          WORKDIR /app
          COPY . .
          RUN pip install --no-cache-dir -r requirements.txt
          CMD ["python", "main.py"]
          EOF
          echo "=== Проверка ==="
          ls -la
          cat Dockerfile

      # 3. Сборка через чистый Docker CLI (без buildx)
      - name: Build and push
        run: |
          cd ${{ github.workspace }}/docker-build
          docker build . -t westsunshine/my-app:latest
          docker push westsunshine/my-app:latest