name: Build and Delivery

on:
  workflow_run:
    workflows: ["Test Python App"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  cd:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      BUILD_CONTEXT: ${{ github.workspace }}/docker-build
    
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          path: ${{ env.BUILD_CONTEXT }}

      - name: Create Dockerfile
        working-directory: ${{ env.BUILD_CONTEXT }}
        run: |
          cat <<'EOF' > Dockerfile
          FROM python:3.12-slim
          WORKDIR /app
          COPY . .
          RUN pip install --no-cache-dir -r requirements.txt
          CMD ["python", "main.py"]
          EOF
          
          echo "=== Verification ==="
          echo "Dockerfile path: $(pwd)/Dockerfile"
          echo "Dockerfile exists: $(test -f Dockerfile && echo 'YES' || echo 'NO')"
          echo "Directory contents:"
          ls -la
          echo "Requirements:"
          cat requirements.txt || echo "requirements.txt not found"

      # Шаг 3: Сборка с явным локальным контекстом
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/my-app:latest
          no-cache: true
          build-args: |
            BUILD_CONTEXT=${{ env.BUILD_CONTEXT }}
