name: Build and Delivery

on:
  workflow_run:
    workflows: ["Test Python App"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  cd:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          path: 'docker-build-context'

      - name: Prepare build context
        working-directory: ${{ github.workspace }}/docker-build-context
        run: |
          cat <<EOF > Dockerfile
          FROM python:3.12-slim
          WORKDIR /app
          COPY . .
          RUN pip install --no-cache-dir -r requirements.txt
          CMD ["python", "main.py"]
          EOF
          
          echo "=== Dockerfile content ==="
          cat Dockerfile
          echo "=== Directory structure ==="
          ls -la
          echo "=== Requirements.txt ==="
          cat requirements.txt || echo "requirements.txt not found"

      # Шаг 3: Сборка с явным указанием локального контекста
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/docker-build-context
          file: ${{ github.workspace }}/docker-build-context/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/my-app:latest
          no-cache: true